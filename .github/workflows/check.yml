# checks/check_dotfiles on every push and pull request, on the macOS this repo is for.
name: check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the tools the checks run
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install shellcheck neovim tmux
      - name: Fix completion dirs, as brew_setup does on a Mac
        shell: zsh {0}
        run: |
          HOMEBREW_PREFIX=$(brew --prefix) real_script_dir=$PWD
          source zsh/.functions
          fix_completion_dirs
      - name: debug compaudit
        shell: zsh {0}
        run: |
          TERM=xterm-256color ZDOTDIR=$PWD zsh -i -c 'autoload -Uz compaudit; for d in $(compaudit 2>&1); do ls -ld $d; done; print -l $fpath' < /dev/null 2>&1 || true
      - name: check_dotfiles
        run: checks/check_dotfiles -v
