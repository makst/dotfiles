# checks/check_dotfiles on every push and pull request, on the macOS this repo is for.
name: check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the tools the checks run
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install shellcheck neovim tmux
      - name: Fix completion dirs, as setup_brew does on a Mac
        shell: zsh {0}
        run: TERM=xterm-256color ZDOTDIR=$PWD zsh -i -c fix_completion_dirs < /dev/null
      - name: check_dotfiles
        run: checks/check_dotfiles -v
