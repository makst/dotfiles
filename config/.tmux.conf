# Symlinked to ~/.tmux.conf by setup_tmux (zsh/.functions), which also installs the plugins below.

# -- terminal ------------------------------------------------------------------
# tmux-256color ships with macOS; RGB enables true colour for nvim inside tmux (Ghostty: xterm-ghostty)
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB,xterm-256color:RGB"
# undercurl + coloured underlines (nvim diagnostics)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

set -s escape-time 10       # no lag on <Esc> in nvim / zsh-vi-mode
set -g focus-events on      # nvim autoread
set -g history-limit 50000
set -g mouse on
set -g set-clipboard on     # copies reach the macOS clipboard via OSC 52, also over ssh
set -g allow-passthrough on # images / notifications from programs inside tmux

# windows and panes count from 1, like the keyboard
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# -- prefix: C-a ----------------------------------------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

bind r source-file ~/.tmux.conf \; display '~/.tmux.conf reloaded'

# -- panes and windows -----------------------------------------------------------
# C-h/j/k/l (no prefix) move between tmux panes and nvim splits: vim-tmux-navigator plugin below.

# splits and new windows keep the current directory
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'

bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

bind -r C-h previous-window
bind -r C-l next-window

# -- copy mode (vi) ---------------------------------------------------------------
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line

bind b list-buffers  # list paste buffers
bind p paste-buffer  # paste from the top paste buffer
bind P choose-buffer # choose which buffer to paste from

# -- status line --------------------------------------------------------------------
# ANSI colours only, so it follows the Ghostty theme (config/ghostty/config)
set -g status-position top
set -g status-justify left
set -g status-style 'bg=default,fg=white'
set -g status-left-length 40
set -g status-left '#[fg=black,bg=blue,bold] #S #[default] '
set -g status-right-length 60
set -g status-right '#{?client_prefix,#[fg=black#,bg=yellow#,bold] PREFIX #[default] ,}#[fg=brightblack]%a %d %b #[fg=white]%H:%M #[fg=brightblack]#(pmset -g batt | grep -Eo "[0-9]+%%") '
setw -g window-status-format '#[fg=brightblack] #I #W#{?window_zoomed_flag, 󰊓,} '
setw -g window-status-current-format '#[fg=blue,bold] #I #W#{?window_zoomed_flag, 󰊓,} '
set -g pane-border-style 'fg=brightblack'
set -g pane-active-border-style 'fg=blue'
set -g message-style 'fg=yellow,bg=default'
setw -g mode-style 'fg=black,bg=yellow'

# -- plugins (tpm: prefix I installs, prefix U updates) -----------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'  # prefix C-s saves, prefix C-r restores
set -g @plugin 'tmux-plugins/tmux-continuum'  # saves every 15 min, restores on tmux start
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

if 'test -f ~/.tmux/plugins/tpm/tpm' 'run ~/.tmux/plugins/tpm/tpm'

