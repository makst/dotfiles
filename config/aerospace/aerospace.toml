# AeroSpace: tiling window manager with its own workspaces; works with SIP on. Linked to
# ~/.config/aerospace/aerospace.toml by setup_aerospace, see docs/aerospace.md.
# Commands: https://nikitabobko.github.io/AeroSpace/commands (also `man aerospace-<command>`)

config-version = 2

start-at-login = true
# saving this file applies it
auto-reload-config = true

# windows split the space side by side on a wide screen, stacked on a tall one; a container inside another
# always splits the other way
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
# accordion (alt-s): windows exactly on top of each other, no strip of the ones behind showing
accordion-padding = 0

# with focus on another display, the mouse moves there too
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

gaps.inner.horizontal = 6
gaps.inner.vertical = 6
gaps.outer.left = 6
gaps.outer.bottom = 6
gaps.outer.top = 6
gaps.outer.right = 6

# apps that float instead of tiling
on-window-detected = [
  { if.app-id = 'com.apple.systempreferences', run = 'layout floating' },
  { if.app-id = 'com.apple.archiveutility', run = 'layout floating' },
  { if.app-id = 'com.nordvpn.NordVPN', run = 'layout floating' },
  # the bar a browser shows while sharing the screen ("meet.google.com is sharing your screen · Stop sharing")
  { if.app-id = 'com.google.Chrome', if.window-title-regex-substring = 'is sharing (your screen|a window|this tab)', run = 'layout floating' },
  { if.app-id = 'com.brave.Browser', if.window-title-regex-substring = 'is sharing (your screen|a window|this tab)', run = 'layout floating' },
  { if.app-id = 'org.mozilla.firefox', if.window-title-regex-substring = 'Sharing Indicator', run = 'layout floating' },
  # IDEs on workspaces of their own, so nvim keeps its workspace: VS Code, the debugger, on 7
  # (docs/debugging.md); Xcode on 8, Android Studio on 9 (docs/mobile.md), each with its simulator or
  # emulator floating on top
  { if.app-id = 'com.microsoft.VSCode', run = 'move-node-to-workspace 7' },
  { if.app-id = 'com.apple.dt.Xcode', run = 'move-node-to-workspace 8' },
  { if.app-id = 'com.apple.iphonesimulator', run = ['layout floating', 'move-node-to-workspace 8'] },
  { if.app-id = 'com.google.android.studio', run = 'move-node-to-workspace 9' },
  # the Android emulator started on its own (`,ae` in nvim, `emulator -avd`) is a qemu process, no bundle id
  { if.app-name-regex-substring = '^qemu-system', run = ['layout floating', 'move-node-to-workspace 9'] },
]

# 7, 8 and 9 stay on the display that isn't the main one (System Settings → Displays → "Use as"), with two
# displays; with one, there is nowhere else for them
[workspace-to-monitor-force-assignment]
7 = 'secondary'
8 = 'secondary'
9 = 'secondary'

# All on Option (Alt), as with yabai before. AeroSpace takes these system-wide, so Alt+h/j/k/l and Alt+digit
# don't reach nvim or zsh.
[mode.main.binding]
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'
# the next window on this workspace, cycling, as Space cycles nvim's splits and C-Space tmux panes
alt-space = 'focus dfs-next --wrap-around'

# resize: Shift+h/j/k/l, as prefix H/J/K/L in tmux (arrows in nvim): narrower, taller, shorter, wider
alt-shift-h = 'resize width -50'
alt-shift-j = 'resize height +50'
alt-shift-k = 'resize height -50'
alt-shift-l = 'resize width +50'

# move the window through the layout (into the neighbouring container, then out to the edge)
alt-ctrl-shift-h = 'move left'
alt-ctrl-shift-j = 'move down'
alt-ctrl-shift-k = 'move up'
alt-ctrl-shift-l = 'move right'

alt-e = 'layout tiles horizontal vertical'      # split side by side / stacked
alt-s = 'layout accordion tiles'                # windows on top of each other, the focused one in front (toggle)
alt-t = 'layout floating tiling'                # float / tile
alt-z = 'fullscreen'                            # fill the workspace (not macOS full screen)
alt-equal = 'balance-sizes'

alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-0 = 'workspace-back-and-forth'
# previous / next workspace with windows, as cmd+[ / cmd+] for tmux windows
alt-leftSquareBracket = 'workspace --wrap-around prev'
alt-rightSquareBracket = 'workspace --wrap-around next'

# move the window to that workspace and follow it
alt-shift-1 = 'move-node-to-workspace --focus-follows-window 1'
alt-shift-2 = 'move-node-to-workspace --focus-follows-window 2'
alt-shift-3 = 'move-node-to-workspace --focus-follows-window 3'
alt-shift-4 = 'move-node-to-workspace --focus-follows-window 4'
alt-shift-5 = 'move-node-to-workspace --focus-follows-window 5'
alt-shift-6 = 'move-node-to-workspace --focus-follows-window 6'
alt-shift-7 = 'move-node-to-workspace --focus-follows-window 7'
alt-shift-8 = 'move-node-to-workspace --focus-follows-window 8'
alt-shift-9 = 'move-node-to-workspace --focus-follows-window 9'

# the window to the next / previous display, and follow it
alt-shift-n = 'move-node-to-monitor --focus-follows-window --wrap-around next'
alt-shift-p = 'move-node-to-monitor --focus-follows-window --wrap-around prev'
# the whole workspace to the next display
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

alt-shift-semicolon = 'mode service'

# alt-shift-; then one key, for things done rarely
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']             # reset the workspace's layout
backspace = ['close-all-windows-but-current', 'mode main']
# the focused window and the one in that direction go into a container of their own (alt-e then splits it
# the other way)
h = ['join-with left', 'mode main']
j = ['join-with down', 'mode main']
k = ['join-with up', 'mode main']
l = ['join-with right', 'mode main']
