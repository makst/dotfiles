#* btop's settings that differ from its defaults (`btop --default-config` prints them all); linked to
#* ~/.config/btop/btop.conf by setup_btop (zsh/.functions). See docs/zsh.md, "Other command-line tools".

#* the terminal's 16 colours, so btop follows the base16 theme (docs/theme.md), with the terminal's background
color_theme = "TTY"
theme_background = false

#* h/j/k/l, g/G move in lists; help and kill move to shift+h and shift+k
vim_keys = true

#* btop would otherwise write every setting into this file, through the link, when it quits: change a
#* setting here, not in btop's menu
save_config_on_exit = false
