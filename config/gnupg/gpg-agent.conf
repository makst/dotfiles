# Linked to ~/.gnupg/gpg-agent.conf by setup_gpg. GPG is only for `pass`; git signs with SSH.

# passphrase prompts in a macOS dialog, which can save the passphrase in the keychain
pinentry-program /opt/homebrew/bin/pinentry-mac
# without the keychain: the passphrase is remembered for 10 minutes after use, 2 hours at most
default-cache-ttl 600
max-cache-ttl 7200
