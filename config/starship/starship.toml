# Starship prompt: https://starship.rs/config/
# Loaded via STARSHIP_CONFIG (zsh/.zshdefault). Colours are ANSI names, so they follow the Ghostty theme.

"$schema" = 'https://starship.rs/config-schema.json'

# two lines: context on the first, the input on its own line
format = """
$directory\
$git_branch\
$git_state\
$git_status\
$kubernetes\
${env_var._PROMPT_GCLOUD}\
${env_var._PROMPT_GCLOUD_PROD}\
$nodejs\
$python\
$golang\
$cmd_duration\
$jobs\
$fill\
$time
$character"""

add_newline = true
# commands get 2 s: the first `git status` in a repo after a reboot starts the fsmonitor daemon (~1 s)
command_timeout = 2000

[directory]
style = "bold blue"
truncation_length = 4
truncate_to_repo = true
read_only = " 󰌾"

[git_branch]
format = "[$symbol$branch(:$remote_branch)]($style) "
symbol = "\uf418 "
style = "purple"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "yellow"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"

[git_state]
style = "bold yellow"

[kubernetes]
disabled = false
format = "[$symbol$context( \\($namespace\\))]($style) "
symbol = "󱃾 "
style = "cyan"

# the active gcloud project, inside git repos only, set by _prompt_gcloud (zsh/.zshdefault): it's clear whether
# commands go to staging or production, and production is red
[env_var._PROMPT_GCLOUD]
format = "[󱇶 $env_value]($style) "
style = "blue"

[env_var._PROMPT_GCLOUD_PROD]
format = "[󱇶 PROD $env_value]($style) "
style = "bold red"

[nodejs]
format = "[$symbol($version)]($style) "
symbol = "\ue718 "
style = "green"
# only in node projects, not for every directory with a .js file
detect_extensions = []

[python]
format = "[$symbol$pyenv_prefix($version)(\\($virtualenv\\))]($style) "
symbol = "\ue235 "
style = "yellow"

[golang]
format = "[$symbol($version)]($style) "
symbol = "\ue627 "
style = "cyan"

[cmd_duration]
min_time = 2_000
format = "[\uf017 $duration]($style) "
style = "bright-black"

[jobs]
symbol = "\uf013 "
style = "bright-black"

# the time the prompt appeared, at the right end of the first line: when the command above finished
[fill]
symbol = " "

[time]
disabled = false
format = "[$time]($style)"
time_format = "%H:%M"
style = "bright-black"

[character]
success_symbol = "[❯](white)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](white)"
