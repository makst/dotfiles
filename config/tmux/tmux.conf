# ~/.config/tmux is symlinked to this directory by setup_tmux (zsh/functions/tmux.zsh), which also installs the
# plugins below. A new Ghostty window attaches to the session "main" when no other window shows it (command in
# config/ghostty/config) and maps its Cmd keys onto the bindings here, see the "Ghostty" section below.

# -- terminal ------------------------------------------------------------------
# tmux-256color ships with macOS; RGB enables true colour for nvim inside tmux (Ghostty: xterm-ghostty)
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:hyperlinks:sync,xterm-256color:RGB"
# undercurl + coloured underlines (nvim diagnostics)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

set -s escape-time 10       # no lag on <Esc> in nvim / zsh
set -g focus-events on      # nvim autoread
set -g history-limit 50000
set -g mouse on
set -g set-clipboard on     # copies reach the macOS clipboard via OSC 52, also over ssh
set -g allow-passthrough on # images / notifications from programs inside tmux
set -g set-titles on        # Ghostty's window title shows session and window
set -g set-titles-string '#S · #W'
set -g detach-on-destroy off # closing a session switches to another one instead of closing Ghostty

# fzf's options for the pickers in popups, from the file the shell uses too (config/fzf/fzfrc), reached through
# ~/.config/tmux, which links to this directory. The server keeps the environment it started with, so a
# FZF_DEFAULT_OPTS from that shell would stay, stale, on top of the file.
set-environment -g FZF_DEFAULT_OPTS_FILE "$HOME/.config/tmux/../fzf/fzfrc"
set-environment -gu FZF_DEFAULT_OPTS

# windows and panes count from 1, like the keyboard
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# -- prefix: C-a ----------------------------------------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

bind r source-file ~/.config/tmux/tmux.conf \; display 'tmux.conf reloaded'

# -- panes and windows -----------------------------------------------------------
# C-h/j/k/l (no prefix) move between tmux panes and nvim splits: vim-tmux-navigator plugin below.
# C-Space (no prefix) cycles to the next pane, as Space cycles nvim's splits; it never reaches nvim or the shell.
bind -n C-Space select-pane -t :.+

# splits and new windows keep the current directory
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'

# resize: Shift+h/j/k/l, as alt+shift+h/j/k/l in AeroSpace (arrows in nvim); = makes the panes equal, as alt+=
# and ,= in nvim; z (tmux's own, cmd+shift+enter) zooms, as alt+z and ,z
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2
bind = select-layout -E

# previous / next window, as cmd+[ / cmd+]; they replace tmux's copy mode and paste keys, which are on Enter and
# p here. Not repeatable: -r would make a C-h / C-l right after cmd+[ / cmd+] switch windows, not panes
bind [ previous-window
bind ] next-window

# -- sessions -----------------------------------------------------------------------
# f: fzf over running sessions and zoxide directories, creates a session per directory (also `tm` in zsh)
# w: fzf over all sessions and windows as tmux draws its tree, e.g. to see which agent is waiting
# a: fzf over the Claude Code agents only, most urgent first, with a live preview of each one's screen
# tmux's own centring (-x C -y C) puts a popup one column left and one row up, counting the status line too;
# these centre it on the window, below the status line. -y is the popup's bottom edge.
set -g @popup-x '#{e|/:#{e|-:#{client_width},#{popup_width}},2}'
set -g @popup-y '#{e|/:#{e|+:#{e|+:#{client_height},#{popup_height}},1},2}'
bind f display-popup -E -B -x '#{E:@popup-x}' -y '#{E:@popup-y}' -w 80% -h 80% '~/.config/tmux/sessionizer --height=100%'
# a pane with an agent: one the hooks have reported on, or one running claude that hasn't had an event since
set -g @claude-agent '#{||:#{@claude},#{==:#{pane_current_command},claude}}'
# a session the lists show (f, w, a, A): any but _scratch, where the hidden shells wait (config/tmux/scratch),
# or another whose name starts with _; the pickers read it as #{?@listed,#{E:@listed},1}, so a server that
# hasn't loaded this line lists every session rather than none
set -g @listed '#{?#{m:_*,#{session_name}},0,1}'
bind w display-popup -E -B -x '#{E:@popup-x}' -y '#{E:@popup-y}' -w 80% -h 80% '~/.config/tmux/tree --height=100%'
bind a display-popup -E -B -x '#{E:@popup-x}' -y '#{E:@popup-y}' -w 80% -h 80% '~/.config/tmux/agents --height=100%'
# A: jump to the next agent that needs you, waiting before done, in any session; again for the one after
bind A run-shell -b '~/.config/tmux/next-agent "#{client_name}" "#{pane_id}"'
# S: back to the last session (tmux's default for this, prefix L, resizes panes here)
bind S switch-client -l
# ( / ): previous / next session, as tmux's own do, past the ones the lists leave out (_scratch); once more is
# enough, as they sit together at the top (_ sorts before lowercase)
bind ( { switch-client -p; if -F '#{m:_*,#{client_session}}' { switch-client -p } }
bind ) { switch-client -n; if -F '#{m:_*,#{client_session}}' { switch-client -n } }

# -- Ghostty ---------------------------------------------------------------------------
# Ghostty sends prefix + key for its Cmd shortcuts (config/ghostty/config):
#   cmd+t c   cmd+d |   cmd+shift+d -   cmd+w x   cmd+1..9 window   cmd+0 l   ctrl+0 ;   cmd+[ / cmd+] [ / ]
#   cmd+shift+0 S (last session)
#   cmd+r , / cmd+shift+r $ (rename window / session)   cmd+shift+enter z   cmd+k f   cmd+j w   cmd+shift+j a
#   cmd+shift+space A   cmd+f /
# /: search the scrollback, incremental (n / N for the next / previous match)
bind / copy-mode \; command-prompt -i -p '(search up)' "send -X search-backward-incremental '%%'"

# -- copy mode (vi) ---------------------------------------------------------------
setw -g mode-keys vi
# vi keys in the command prompt too (C-a :, rename, search): tmux picks them only when EDITOR or VISUAL
# contains "vi", which a Mac or a shell without them wouldn't have
set -g status-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'
set -g copy-command 'pbcopy' # mouse selections too
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line

bind p paste-buffer # paste from the top paste buffer
# P: the paste buffers in the picker, the whole text in the preview; Enter pastes the chosen one
bind P display-popup -E -B -x '#{E:@popup-x}' -y '#{E:@popup-y}' -w 80% -h 80% '~/.config/tmux/buffers --height=100%'

# -- Claude Code agents -------------------------------------------------------------
# Claude Code's hooks set the pane option @claude to what the agent is doing (config/claude/hooks/tmux-state.sh):
# working, waiting (for a permission or an answer), done (finished, not seen yet) or idle. A window and a session
# show their most urgent agent, in that order: waiting, done, working. Idle shows nothing.
set -g @claude-window-state '#{?#{m:*waiting*,#{P:#{@claude} }},waiting,#{?#{m:*done*,#{P:#{@claude} }},done,#{?#{m:*working*,#{P:#{@claude} }},working,}}}'
set -g @claude-session-state '#{?#{m:*waiting*,#{W:#{P:#{@claude} }}},waiting,#{?#{m:*done*,#{W:#{P:#{@claude} }}},done,#{?#{m:*working*,#{W:#{P:#{@claude} }}},working,}}}'
# the window mark: yellow bell waiting, green tick done, cyan hourglass working (the pickers use the same, in
# config/tmux/picker.zsh)
set -g @claude-window-mark '#{?#{==:#{E:@claude-window-state},waiting},#[fg=yellow]󰂞,#{?#{==:#{E:@claude-window-state},done},#[fg=green]󰄬,#{?#{==:#{E:@claude-window-state},working},#[fg=cyan]󰔟,}}}'
# one x per agent in each state, across all sessions: the status line counts them with #{n:…}
set -g @claude-all-waiting '#{S:#{W:#{P:#{?#{==:#{@claude},waiting},x,}}}}'
set -g @claude-all-done '#{S:#{W:#{P:#{?#{==:#{@claude},done},x,}}}}'
set -g @claude-all-working '#{S:#{W:#{P:#{?#{==:#{@claude},working},x,}}}}'
set -g @claude-summary '#{?#{E:@claude-all-waiting},#[fg=yellow]󰂞 #{n:#{E:@claude-all-waiting}}  ,}#{?#{E:@claude-all-done},#[fg=green]󰄬 #{n:#{E:@claude-all-done}}  ,}#{?#{E:@claude-all-working},#[fg=cyan]󰔟 #{n:#{E:@claude-all-working}}  ,}'
# looking at a window means you've seen its finished agents: done turns idle on every window and session switch
set -g @claude-seen 'run-shell -b ":; #{P:#{?#{==:#{@claude},done},tmux set -pt #{pane_id} @claude idle;,}}"'
set-hook -g session-window-changed 'run -C "#{@claude-seen}"'
set-hook -g client-session-changed 'run -C "#{@claude-seen}"'

# -- status line --------------------------------------------------------------------
# ANSI colours only, so it follows the Ghostty theme (config/ghostty/config)
set -g status-position top
set -g status-justify left
set -g status-style 'bg=default,fg=white'
set -g status-left-length 40
set -g status-left '#[fg=black,bg=blue,bold] #S #[default] '
set -g status-right-length 120
# Claude Code agents waiting / done / working, GitHub (@github, set by config/github/watch), then the prefix,
# date and time, battery: two spaces between groups, as between the windows, and grey like the prompt's time
# below, flush with the right edge as it is
set -g status-right '#{E:@claude-summary}#{@github}#{?client_prefix,#[fg=black#,bg=yellow#,bold] PREFIX #[default]  ,}#[fg=brightblack]%a %d %b %H:%M  #(pmset -g batt | grep -Eo "[0-9]+%%")'
# a window that rang the bell (e.g. Claude Code waiting for input) turns yellow until you visit it; a window
# with Claude Code in it shows its agent's mark instead of the bell's
setw -g window-status-format '#{?window_bell_flag,#[fg=yellow#,bold],#[fg=brightblack]} #I #W#{?window_zoomed_flag, 󰊓,}#{?#{E:@claude-window-state}, #{E:@claude-window-mark},#{?window_bell_flag, 󰂞,}} '
setw -g window-status-current-format '#[fg=blue,bold] #I #W#{?window_zoomed_flag, 󰊓,}#{?#{E:@claude-window-state}, #{E:@claude-window-mark},} '
setw -g window-status-bell-style 'default'
setw -g window-status-current-style 'default' # tmux 3.8 underlines it by default; blue and bold is enough
# windows are padded with a space on each side: two spaces between them, as between the session and the first
setw -g window-status-separator ''
set -g monitor-bell on
set -g bell-action any # bells also reach Ghostty: dock bounce and a bell in the title when it's in the background
set -g pane-border-style 'fg=brightblack'
set -g pane-active-border-style 'fg=blue'
set -g message-style 'fg=yellow,bg=default'
setw -g mode-style 'fg=black,bg=yellow'
# tmux 3.8's theme colours (popups, menus, the tree, copy-mode matches, the command prompt) are fixed shades
# like skyblue3 or gray15; mapped to the ANSI ones, they follow the Ghostty theme too. Dark grey is the
# background of popups and menus: the terminal's own. (-q: tmux before 3.8 has no such options.)
set -sq dark-theme-black black
set -sq dark-theme-white white
set -sq dark-theme-light-grey brightblack
set -sq dark-theme-dark-grey default
set -sq dark-theme-green green
set -sq dark-theme-yellow yellow
set -sq dark-theme-red red
set -sq dark-theme-blue blue
set -sq dark-theme-cyan cyan
set -sq dark-theme-magenta magenta
set -sq light-theme-black black
set -sq light-theme-white white
set -sq light-theme-light-grey brightblack
set -sq light-theme-dark-grey default
set -sq light-theme-green green
set -sq light-theme-yellow yellow
set -sq light-theme-red red
set -sq light-theme-blue blue
set -sq light-theme-cyan cyan
set -sq light-theme-magenta magenta
# rounded borders, like fzf's; the session picker's popup has none (-B): fzf draws its own, as in the shell
set -g popup-border-lines rounded
set -g menu-border-lines rounded

# -- plugins (tpm: prefix I installs, prefix U updates) -----------------------------
# outside ~/.config/tmux, which is this repo
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @vim_navigator_mapping_prev '' # no C-\ for the last pane: ctrl+0 (prefix ;) does that
set -g @plugin 'tmux-plugins/tmux-resurrect'  # prefix C-s saves, prefix C-r restores
set -g @plugin 'tmux-plugins/tmux-continuum'  # saves every 15 min, restores on tmux start
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

if 'test -f ~/.tmux/plugins/tpm/tpm' 'run ~/.tmux/plugins/tpm/tpm'

