# The tmux config the GIFs are recorded with (make_gifs in zsh/.functions): the real one, run in a separate
# tmux server with a throwaway HOME, so resurrect and continuum neither restore nor overwrite the real
# sessions. Shells inside get the real HOME back, so they look like the everyday ones.
source-file "$DOTFILES/config/tmux/tmux.conf"
set-environment -g HOME "$REAL_HOME"
set-environment -gu DOTFILES
# no AWS profile or region in the prompt (starship)
set-environment -g AWS_CONFIG_FILE /dev/null
set-environment -g AWS_SHARED_CREDENTIALS_FILE /dev/null

# a second status line with the keys just pressed, set by docs/tapes/keycast
set -g status 2
set -g @keys ''
set -g status-format[1] '#[align=centre]#{E:@keys}'
