# The tmux config the GIFs are recorded with (make_gifs in zsh/.functions): the real one, from the HOME that
# docs/tapes/demo-home builds, in a separate tmux server, so the real sessions are never touched.
source-file ~/.config/tmux/tmux.conf

# a pane's title is the hostname until a program sets one; the session tree shows it
set-hook -g after-new-session 'select-pane -T mac'
set-hook -g after-new-window 'select-pane -T mac'
set-hook -g after-split-window 'select-pane -T mac'

# a second status line with the keys just pressed, set by docs/tapes/keycast
set -g status 2
set -g @keys ''
set -g status-format[1] '#[align=centre]#{E:@keys}'
